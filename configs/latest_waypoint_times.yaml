# Manual timing transcription from CamScanner 18-05-26 19.43.pdf.
#
# For 10-loop files:
#   no. 1 = mulai gerak dari (1,1)
#   no. 2 = sampai (3,1)
#   no. 3 = sampai (3,3)
#   no. 4 = sampai (1,3)
#   no. 5 = kembali ke (1,1), and so on.
#
# For 5-loop files:
#   each pair is [awal_gerak, akhir_gerak] for one rectangle side.
#   Gaps between intervals are treated as stopped at the waypoint.

